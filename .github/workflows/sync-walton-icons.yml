name: Sync Walton remote into bundle

on:
  push:
    paths:
      - 'remote-designs/walton-ceiling-fan.js'
      - '.github/workflows/sync-walton-icons.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update bundled Walton design
        run: |
          python3 - <<'PY'
          from pathlib import Path
          main = Path('universal-remote-card.js')
          text = main.read_text()
          start = text.index("const waltonCeilingFanRemote=")
          end = text.index("const boxRemote=", start)
          new = """const waltonCeilingFanRemote={id:'walton-ceiling-fan',label:'Walton Ceiling Fan',defaultName:'Walton Ceiling Fan',controls:[{key:'power',label:'Power'},{key:'led',label:'LED'},...Array.from({length:6},(_,i)=>({key:`speed_${i+1}`,label:`Speed ${i+1}`})),{key:'timer_2h',label:'Timer 2H'},{key:'timer_4h',label:'Timer 4H'},{key:'timer_8h',label:'Timer 8H'},{key:'eco',label:'ECO'},{key:'reverse',label:'Reverse'}],render(ctx){const p=ctx.state(ctx.room.actions?.power),on=p?.state==='on';const powerIcon=`<svg viewBox=\"0 0 64 64\" class=\"walton-control-icon\"><path d=\"M32 8v23\"/><path d=\"M18 14a25 25 0 1 0 28 0\"/></svg>`;const ledIcon=`<svg viewBox=\"0 0 64 64\" class=\"walton-control-icon\"><path d=\"M22 39h20M24 46h16M27 53h10\"/><path d=\"M20 28a12 12 0 1 1 24 0c0 5-3 7-6 11H26c-3-4-6-6-6-11z\"/><path d=\"M32 4v6M9 13l5 4M55 13l-5 4\"/></svg>`;const revIcon=`<svg viewBox=\"0 0 64 64\" class=\"walton-rev-icon\"><path d=\"M12 27h28c9 0 14 5 14 13s-5 13-14 13H25\"/><path d=\"M25 45l-8 8 8 8\"/><path d=\"M52 37H24c-9 0-14-5-14-13s5-13 14-13h15\"/><path d=\"M39 3l8 8-8 8\"/></svg>`;return `<div class=\"design-title\">${ctx.escape(ctx.room.device_name||this.defaultName)}</div><div class=\"walton-body\"><div class=\"walton-top\"><button class=\"walton-pill\" data-action=\"power\">${powerIcon}<span>POWER</span></button><button class=\"walton-pill\" data-action=\"led\">${ledIcon}<span>LED</span></button></div><div class=\"walton-circle ${on?'on':''}\">${[1,2,3,4,5,6].map(n=>`<button class=\"walton-speed w${n}\" data-action=\"speed_${n}\">${n}</button>`).join('')}<div class=\"walton-center\"><svg class=\"walton-fan-icon\" viewBox=\"0 0 64 64\"><g fill=\"currentColor\"><path d=\"M32 30C27 27 27 18 30 11c2-5 7-8 10-5 5 4 2 14-2 21-1 2-3 3-6 3z\"/><path d=\"M35 32c2-5 11-7 18-4 5 2 8 7 5 10-4 5-14 2-21-2-2-1-3-3-2-4z\"/><path d=\"M32 35c5 1 7 10 4 17-2 5-7 8-10 5-5-4-2-14 2-21-1-2 3-3 4-1z\"/><path d=\"M29 33c-1 5-10 7-17 4-5-2-8-7-5-10 4-5 14-2 21 2 2 1 3 3 1 4z\"/><circle cx=\"32\" cy=\"32\" r=\"6\" fill=\"currentColor\"/></g></svg></div></div><div class=\"walton-timers\"><button data-action=\"timer_2h\">2H</button><button data-action=\"timer_4h\">4H</button><button data-action=\"timer_8h\">8H</button></div><div class=\"walton-bottom\"><button data-action=\"eco\">ECO</button><button data-action=\"reverse\">${revIcon}<span>REV</span></button></div></div>`;}};\n"""
          text = text[:start] + new + text[end:]
          marker = '.walton-top{'
          if '.walton-control-icon' not in text:
              text = text.replace(marker, '.walton-control-icon{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.walton-rev-icon{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.walton-pill{display:flex;align-items:center;justify-content:center;gap:8px}.walton-bottom button{display:flex;align-items:center;justify-content:center;gap:8px}'+marker)
          main.write_text(text)
          PY
      - name: Commit bundle
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add universal-remote-card.js
          git diff --cached --quiet || git commit -m 'Fix bundled Walton remote icons'
          git push
