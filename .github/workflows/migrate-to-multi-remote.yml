name: Migrate to Multi-Remote Card

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/migrate-to-multi-remote.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rename project files and branding
        shell: bash
        run: |
          set -e

          git mv universal-remote-card.js multi-remote-card.js
          git mv assets/universal-remote-card-preview.svg assets/multi-remote-card-preview.svg

          # Replace project branding and identifiers everywhere in tracked text files.
          git grep -Il -e 'Universal Remote Card' -e 'universal-remote-card' -e 'UniversalRemoteCard' | while IFS= read -r file; do
            sed -i \
              -e 's/Universal Remote Card/Multi-Remote Card/g' \
              -e 's/universal-remote-card/multi-remote-card/g' \
              -e 's/UniversalRemoteCard/MultiRemoteCard/g' \
              "$file"
          done

          # Ensure HACS points to the renamed entry file.
          cat > hacs.json <<'EOF'
          {
            "name": "Multi-Remote Card",
            "filename": "multi-remote-card.js",
            "content_in_root": true,
            "render_readme": true
          }
          EOF

          git add -A
          git diff --cached --check
          git diff --cached --stat

      - name: Commit migration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Migrate Universal Remote Card to Multi-Remote Card'
          git push
