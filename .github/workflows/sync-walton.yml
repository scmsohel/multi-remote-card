name: Sync Walton Remote Bundle

on:
  push:
    paths:
      - 'remote-designs/walton-ceiling-fan.js'
      - '.github/workflows/sync-walton.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sync Walton source into bundled card
        shell: python
        run: |
          from pathlib import Path

          main = Path('universal-remote-card.js')
          source = Path('remote-designs/walton-ceiling-fan.js').read_text()
          source = source.replace('export const waltonCeilingFanRemote', 'const waltonCeilingFanRemote', 1)

          # Reuse the exact shared Basic Fan button classes so the existing
          # press feedback is used instead of creating a second animation system.
          source = source.replace('class="walton-speed', 'class="speed walton-speed')
          source = source.replace('class="walton-center"', 'class="fan-button walton-center"')
          source = source.replace('class="walton-pill"', 'class="mode-button walton-pill"')
          source = source.replace('<button data-action="timer_', '<button class="mode-button" data-action="timer_')
          source = source.replace('<button data-action="eco">', '<button class="mode-button" data-action="eco">')
          source = source.replace('<button data-action="reverse">', '<button class="wide-button" data-action="reverse">')

          text = main.read_text()
          start = text.index('// Modern segmented Walton remote layout.')
          end = text.index('const boxRemote=', start)
          replacement = '// Modern segmented Walton remote layout.\n' + source.rstrip() + '\n'
          text = text[:start] + replacement + text[end:]
          main.write_text(text)

      - name: Commit bundled card
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add universal-remote-card.js
          git diff --cached --quiet || git commit -m 'Sync Walton with Basic Fan press feedback'
          git push
