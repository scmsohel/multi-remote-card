name: Sync DEV to Stable

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-walton.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Sync latest DEV snapshot (excluding banner)
        run: |
          set -e
          BASE="https://raw.githubusercontent.com/scmsohel/multi-remote-card-dev/main"
          curl -fsSL "$BASE/README.md" -o README.md
          curl -fsSL "$BASE/hacs.json" -o hacs.json
          curl -fsSL "$BASE/multi-remote-card.js" -o multi-remote-card.js
          curl -fsSL "$BASE/remote-designs/box.js" -o remote-designs/box.js
          curl -fsSL "$BASE/remote-designs/fan.js" -o remote-designs/fan.js
          curl -fsSL "$BASE/remote-designs/walton-ceiling-fan.js" -o remote-designs/walton-ceiling-fan.js
          curl -fsSL "$BASE/assets/multi-remote-card-preview.svg" -o assets/multi-remote-card-preview.svg
          curl -fsSL "$BASE/assets/universal-remote-card-preview.svg" -o assets/universal-remote-card-preview.svg

      - name: Commit stable snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md hacs.json multi-remote-card.js remote-designs assets/multi-remote-card-preview.svg assets/universal-remote-card-preview.svg
          if git diff --cached --quiet; then
            echo 'No changes to sync.'
            exit 0
          fi
          git commit -m 'Sync latest DEV snapshot to stable'
          git push origin main
