name: Sync Walton Remote Bundle

on:
  push:
    paths:
      - 'remote-designs/walton-ceiling-fan.js'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix bundled Walton export
        shell: python
        run: |
          from pathlib import Path
          p = Path('universal-remote-card.js')
          s = p.read_text()
          s2 = s.replace('export const waltonCeilingFanRemote', 'const waltonCeilingFanRemote')
          if s2 == s:
              raise SystemExit('Bundled Walton export string was not found')
          p.write_text(s2)

      - name: Commit bundled card
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add universal-remote-card.js
          git diff --cached --quiet || git commit -m 'Fix Walton bundled module syntax'
          git push