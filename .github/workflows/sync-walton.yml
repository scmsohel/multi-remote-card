name: Sync Walton Remote Bundle

on:
  push:
    paths:
      - 'remote-designs/walton-ceiling-fan.js'
      - '.github/workflows/sync-walton.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sync Walton source into bundled card
        shell: python
        run: |
          from pathlib import Path

          main = Path('universal-remote-card.js')
          source = Path('remote-designs/walton-ceiling-fan.js').read_text()
          source = source.replace('export const waltonCeilingFanRemote', 'const waltonCeilingFanRemote', 1)

          text = main.read_text()
          start = text.index('// Modern segmented Walton remote layout.')
          end = text.index('const boxRemote=', start)
          replacement = '// Modern segmented Walton remote layout.\n' + source.rstrip() + '\n'
          text = text[:start] + replacement + text[end:]
          main.write_text(text)

      - name: Commit bundled card
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add universal-remote-card.js
          git diff --cached --quiet || git commit -m 'Sync final Walton segmented remote design'
          git push
