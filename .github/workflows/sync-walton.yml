name: Sync Walton Remote Bundle

on:
  push:
    paths:
      - 'remote-designs/walton-ceiling-fan.js'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update bundled Walton design
        shell: python
        run: |
          from pathlib import Path
          import re

          source = Path('remote-designs/walton-ceiling-fan.js').read_text()
          source = re.sub(r'(?s)^.*?export\s+const\s+waltonCeilingFanRemote\s*=\s*', 'const waltonCeilingFanRemote=', source.strip(), count=1)
          source = source.rstrip().rstrip(';') + ';'

          main_path = Path('universal-remote-card.js')
          main = main_path.read_text()
          pattern = r'const waltonCeilingFanRemote=.*?;\s*(?=const boxRemote=)'
          updated, count = re.subn(pattern, source + '\n', main, count=1, flags=re.S)
          if count != 1:
              raise SystemExit('Could not locate bundled Walton design in universal-remote-card.js')

          css = r'''\n/* Walton modern segmented remote */\n.walton-modern .walton-circle{position:relative;width:min(430px,100%);aspect-ratio:1;margin:18px auto 24px;border-radius:50%;background:radial-gradient(circle,var(--c1),var(--c2));border:1px solid var(--border);box-shadow:inset 0 0 20px var(--border),0 15px 30px var(--shadow)}\n.walton-modern .walton-speed{position:absolute;width:31%;height:31%;border:0;border-radius:24px;background:var(--button);color:var(--button-text);font-size:25px;font-weight:600;box-shadow:0 8px 18px var(--shadow);cursor:pointer;transition:.12s;z-index:2}\n.walton-modern .walton-speed:active,.walton-modern .walton-center:active,.walton-modern .walton-timers button:active,.walton-modern .walton-bottom button:active,.walton-modern .walton-pill:active{transform:scale(.96)}\n.walton-modern .w3{left:34.5%;top:4%}.walton-modern .w2{left:8%;top:24%}.walton-modern .w4{right:8%;top:24%}.walton-modern .w1{left:8%;bottom:23%}.walton-modern .w5{right:8%;bottom:23%}.walton-modern .w6{left:34.5%;bottom:4%}\n.walton-modern .walton-center{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:31%;height:31%;border:0;border-radius:50%;background:var(--button);color:var(--button-text);display:grid;place-items:center;cursor:pointer;box-shadow:inset 0 2px 7px var(--shadow),0 8px 18px var(--shadow);z-index:3}\n.walton-modern .walton-fan-icon{width:52%;height:52%}.walton-modern .walton-timers,.walton-modern .walton-bottom{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.walton-modern .walton-bottom{grid-template-columns:1fr 1fr;margin-top:14px}.walton-modern .walton-timers button,.walton-modern .walton-bottom button{min-height:58px;border:0;border-radius:32px;background:var(--button);color:var(--button-text);box-shadow:0 8px 18px var(--shadow);font-weight:700;font-size:17px;cursor:pointer}.walton-modern .walton-top{display:grid;grid-template-columns:1fr 1fr;gap:14px}.walton-modern .walton-pill{min-height:58px;border:0;border-radius:32px;background:var(--button);color:var(--button-text);box-shadow:0 8px 18px var(--shadow);font-weight:700;font-size:16px;cursor:pointer}.walton-modern .walton-control-icon,.walton-modern .walton-rev-icon{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}\n'''
          if '/* Walton modern segmented remote */' not in updated:
              marker='</style>'
              if marker not in updated:
                  raise SystemExit('Could not find style closing marker')
              updated=updated.replace(marker, css + marker, 1)

          main_path.write_text(updated)

      - name: Commit bundled card
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add universal-remote-card.js
          git diff --cached --quiet || git commit -m 'Fix bundled Walton remote design'
          git push