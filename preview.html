<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Universal Remote Card Preview</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Arial,sans-serif;background:#11151d;color:#111;display:flex;justify-content:center;padding:28px}.toolbar{position:fixed;top:16px;left:50%;transform:translateX(-50%);display:flex;gap:8px;z-index:5}.toolbar button{border:0;border-radius:12px;padding:10px 14px;font-weight:700;cursor:pointer}.preview{width:min(390px,94vw);background:#f4f2ee;border-radius:28px;padding:22px 18px 24px;box-shadow:0 20px 60px #0008}.tabs{display:flex;background:#dddcd8;border-radius:28px;padding:4px;margin-bottom:30px}.tabs button{flex:1;border:0;border-radius:24px;padding:13px;background:transparent;font-weight:700}.tabs .active{background:#292929;color:#fff}.title{text-align:center;letter-spacing:5px;font-weight:700;color:#888;margin-bottom:18px}.circle{width:285px;height:285px;margin:auto;border:1px solid #fff;border-radius:50%;position:relative}.speed{position:absolute;width:54px;height:54px;border:0;border-radius:50%;background:#fff;box-shadow:0 6px 14px #0002;font-size:18px;font-weight:700;cursor:pointer;transition:.16s}.speed:active,.center:active,.btn:active{transform:translateY(5px);box-shadow:0 2px 5px #0002}.s3{left:calc(50% - 27px);top:10px}.s2{left:27px;top:68px}.s4{right:27px;top:68px}.s1{left:18px;bottom:58px}.s5{right:18px;bottom:58px}.s6{left:calc(50% - 27px);bottom:8px}.center{position:absolute;left:calc(50% - 48px);top:calc(50% - 48px);width:96px;height:96px;border:0;border-radius:50%;background:#fff;box-shadow:0 8px 18px #0002;cursor:pointer;font-size:43px;transition:.16s}.reverse{display:block;margin:18px auto 24px;padding:13px 34px;border:0;border-radius:22px;background:#fff;box-shadow:0 5px 12px #0002;font-weight:700;cursor:pointer}.row{display:flex;gap:10px}.btn{flex:1;border:0;border-radius:18px;padding:17px 8px;background:#fff;box-shadow:0 5px 12px #0002;font-weight:700;cursor:pointer;transition:.16s}.timer-title{text-align:center;letter-spacing:4px;color:#888;font-weight:700;margin:30px 0 14px}.flash{animation:flash .35s}@keyframes flash{50%{transform:translateY(4px) scale(.96);filter:brightness(.88)}}body.dark{background:#090c12;color:#eee}.dark .preview{background:#171b22}.dark .circle{border-color:#444}.dark .speed,.dark .center,.dark .reverse,.dark .btn{background:#242a33;color:#fff;box-shadow:0 6px 14px #0008}.dark .tabs{background:#282d35}.dark .tabs .active{background:#f4f4f4;color:#111}.dark .title,.dark .timer-title{color:#9da4ae}
</style></head>
<body>
<div class="toolbar"><button onclick="document.body.classList.remove('dark')">Light</button><button onclick="document.body.classList.add('dark')">Dark</button></div>
<main class="preview"><div class="tabs"><button class="active">BEDROOM</button><button>LOUNGE</button></div><div class="title">FAN</div><div class="circle">
<button class="speed s3" data-action="3">3</button><button class="speed s2" data-action="2">2</button><button class="speed s4" data-action="4">4</button><button class="speed s1" data-action="1">1</button><button class="speed s5" data-action="5">5</button><button class="speed s6" data-action="6">6</button><button class="center" data-action="power">♣</button></div>
<button class="reverse btn" data-action="reverse">⇄ &nbsp; REVERSE</button>
<div class="row"><button class="btn" data-action="eco">ECO</button><button class="btn" data-action="light">💡</button><button class="btn" data-action="max">MAX</button></div>
<div class="timer-title">TIMER</div><div class="row"><button class="btn" data-action="1h">◷ &nbsp;1H</button><button class="btn" data-action="4h">◷ &nbsp;4H</button><button class="btn" data-action="8h">◷ &nbsp;8H</button></div></main>
<script>document.querySelectorAll('[data-action]').forEach(b=>b.addEventListener('click',()=>{b.classList.remove('flash');void b.offsetWidth;b.classList.add('flash');}));</script></body></html>
