<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Universal Remote Card — Live Preview</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Arial,sans-serif;background:#11151d;color:#16181d;display:flex;justify-content:center;padding:28px 16px 50px;transition:.2s}.app{width:min(1120px,100%);display:grid;grid-template-columns:270px 1fr;gap:24px;align-items:start}.panel{background:#fff;border-radius:20px;padding:20px;box-shadow:0 18px 50px #0005;position:sticky;top:20px}.panel h2{margin:0 0 18px;font-size:18px}.field{margin-bottom:16px}.field label{display:block;font-size:12px;font-weight:700;color:#777;margin-bottom:7px}.field select,.field input{width:100%;padding:12px;border:1px solid #d7d7d7;border-radius:10px;background:#fff;font-size:14px}.switch{display:flex;align-items:center;justify-content:space-between;padding:11px 0}.switch input{width:20px;height:20px}.remote{width:min(390px,100%);margin:auto;background:#f4f2ee;border-radius:28px;padding:20px 18px 24px;box-shadow:0 20px 60px #0008;transition:.2s}.tabs{display:flex;background:#dddcd8;border-radius:28px;padding:4px;margin-bottom:28px}.tabs button{flex:1;border:0;border-radius:24px;padding:13px;background:transparent;font-weight:700;cursor:pointer}.tabs .active{background:#292929;color:#fff}.title{text-align:center;letter-spacing:5px;font-weight:700;color:#888;margin-bottom:18px}.circle{width:285px;height:285px;margin:auto;border:1px solid #fff;border-radius:50%;position:relative}.speed{position:absolute;width:54px;height:54px;border:0;border-radius:50%;background:#fff;box-shadow:0 6px 14px #0002;font-size:18px;font-weight:700;cursor:pointer;transition:.16s}.speed:active,.center:active,.btn:active{transform:translateY(5px);box-shadow:0 2px 5px #0002}.s3{left:calc(50% - 27px);top:10px}.s2{left:27px;top:68px}.s4{right:27px;top:68px}.s1{left:18px;bottom:58px}.s5{right:18px;bottom:58px}.s6{left:calc(50% - 27px);bottom:8px}.center{position:absolute;left:calc(50% - 48px);top:calc(50% - 48px);width:96px;height:96px;border:0;border-radius:50%;background:#fff;box-shadow:0 8px 18px #0002;cursor:pointer;transition:.16s;display:grid;place-items:center}.icon{width:42px;height:42px;fill:none;stroke:currentColor;stroke-width:2.5}.fanicon{width:44px;height:44px;fill:currentColor;stroke:none}.reverse{display:block;margin:18px auto 24px}.row{display:flex;gap:10px}.btn{flex:1;border:0;border-radius:18px;padding:17px 8px;background:#fff;box-shadow:0 5px 12px #0002;font-weight:700;cursor:pointer;transition:.16s}.timer-title{text-align:center;letter-spacing:4px;color:#888;font-weight:700;margin:30px 0 14px}.flash{animation:flash .35s}@keyframes flash{50%{transform:translateY(4px) scale(.96);filter:brightness(.88)}}.hidden{display:none}.walton-top{display:flex;gap:10px;margin-bottom:16px}.walton-top .btn{padding:13px 8px}.box-title{text-align:center;font-weight:800;font-size:22px;margin:12px 0 20px}.box-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.box-grid .wide{grid-column:1/3}.note{text-align:center;color:#888;font-size:12px;margin-top:16px}.darkbody{background:#090c12;color:#eee}.darkbody .panel{background:#171b22;color:#eee}.darkbody .field label{color:#aeb5bf}.darkbody .field select,.darkbody .field input{background:#242a33;color:#fff;border-color:#3b424d}.darkbody .remote{background:#171b22;color:#fff}.darkbody .circle{border-color:#444}.darkbody .speed,.darkbody .center,.darkbody .reverse,.darkbody .btn{background:#242a33;color:#fff;box-shadow:0 6px 14px #0008}.darkbody .tabs{background:#282d35}.darkbody .tabs .active{background:#f4f4f4;color:#111}.darkbody .title,.darkbody .timer-title{color:#9da4ae}@media(max-width:760px){.app{grid-template-columns:1fr}.panel{position:static}.remote{width:min(390px,100%)}}
</style>
</head>
<body>
<div class="app">
<aside class="panel">
<h2>Universal Remote Preview</h2>
<div class="field"><label>REMOTE DESIGN</label><select id="design"><option value="fan">Basic Celling Fan</option><option value="walton">Walton Ceiling Fan</option><option value="box">Fenda Sound Box</option></select></div>
<div class="field"><label>THEME</label><select id="theme"><option value="auto">Auto</option><option value="light">Light</option><option value="dark">Dark</option></select></div>
<div class="field"><label>REMOTE NAME</label><input id="remoteName" value="Bedroom Fan"></div>
<div class="switch"><span>Multiple Remote</span><input id="multi" type="checkbox"></div>
<div class="field" id="secondField" style="display:none"><label>REMOTE 2 DESIGN</label><select id="design2"><option value="fan">Basic Celling Fan</option><option value="walton">Walton Ceiling Fan</option><option value="box">Fenda Sound Box</option></select></div>
<div class="field" id="secondNameField" style="display:none"><label>REMOTE 2 NAME</label><input id="remoteName2" value="Lounge Fan"></div>
<p class="note">Buttons are visual only. No Home Assistant connection is required.</p>
</aside>
<main id="stage"></main>
</div>
<script>
const fanSvg='<svg class="fanicon" viewBox="0 0 100 100"><path d="M50 45c-3-18 1-34 13-38 9-3 17 4 15 14-2 10-13 18-28 25zm5 6c18-3 34 1 38 13 3 9-4 17-14 15-10-2-18-13-25-28zm-6 5c3 18-1 34-13 38-9 3-17-4-15-14 2-10 13-18 28-25zm-5-6C26 53 10 49 6 37c-3-9 4-17 14-15 10 2 18 13 25 28z"/></svg>';
const power='<svg class="icon" viewBox="0 0 48 48"><path d="M24 5v17"/><path d="M13 10a17 17 0 1 0 22 0"/></svg>';
const light='<svg class="icon" viewBox="0 0 48 48"><path d="M16 30c-4-4-6-8-6-13a14 14 0 0 1 28 0c0 5-2 9-6 13l-2 4H18l-2-4Z"/><path d="M19 40h10M20 44h8M24 3v-2M7 9 5 7M41 9l2-2M5 20H2M46 20h-3"/></svg>';
const rev='<svg class="icon" viewBox="0 0 48 48"><path d="M9 18h25l-6-6M39 30H14l6 6"/><path d="M34 18a12 12 0 0 1 5 10M14 30a12 12 0 0 1-5-10"/></svg>';
const clock='<svg class="icon" viewBox="0 0 48 48"><circle cx="24" cy="24" r="18"/><path d="M24 13v12l8 5"/></svg>';
function btn(text,cls=''){return `<button class="btn ${cls}" data-action="x">${text}</button>`}
function fanDesign(name='Bedroom Fan',walton=false){return `<section class="remote"><div class="tabs"><button class="active">${name.toUpperCase()}</button>${document.getElementById('multi').checked?'<button>LOUNGE</button>':''}</div>${walton?`<div class="walton-top">${btn(power+' POWER')} ${btn(light+' LED')}</div>`:''}<div class="title">FAN</div><div class="circle"><button class="speed s3" data-action="3">3</button><button class="speed s2" data-action="2">2</button><button class="speed s4" data-action="4">4</button><button class="speed s1" data-action="1">1</button><button class="speed s5" data-action="5">5</button><button class="speed s6" data-action="6">6</button><button class="center" data-action="power">${fanSvg}</button></div>${walton?`${btn(rev+' REVERSE','reverse')}`:`${btn(rev+' REVERSE','reverse')}`}<div class="row">${btn('ECO')}${!walton?btn(light+' LIGHT'):btn(light+' LIGHT')}${btn('MAX')}</div><div class="timer-title">TIMER</div><div class="row">${btn(clock+' 1H')}${btn(clock+' 4H')}${btn(clock+' 8H')}</div></section>`}
function boxDesign(name){return `<section class="remote"><div class="tabs"><button class="active">${name.toUpperCase()}</button>${document.getElementById('multi').checked?'<button>LOUNGE</button>':''}</div><div class="box-title">FENDA SOUND BOX</div><div class="box-grid">${btn(power+' POWER','wide')}${btn('VOL −')}${btn('VOL +')}${btn('PREV')}${btn('NEXT')}${btn('PLAY / PAUSE','wide')}${btn('MODE')}${btn('MUTE')}</div><div class="timer-title">SOUND</div><div class="row">${btn('BASS −')}${btn('BASS +')}</div></section>`}
function renderOne(design,name){if(design==='walton')return fanDesign(name,true);if(design==='box')return boxDesign(name);return fanDesign(name,false)}
function render(){let d=document.getElementById('design').value,n=document.getElementById('remoteName').value||'Remote 1';let html=renderOne(d,n);if(document.getElementById('multi').checked){let d2=document.getElementById('design2').value,n2=document.getElementById('remoteName2').value||'Remote 2';html='<div style="display:flex;gap:24px;flex-wrap:wrap;justify-content:center">'+html+renderOne(d2,n2)+'</div>'}document.getElementById('stage').innerHTML=html;document.querySelectorAll('[data-action]').forEach(b=>b.addEventListener('click',()=>{b.classList.remove('flash');void b.offsetWidth;b.classList.add('flash')}))}
function theme(){let t=document.getElementById('theme').value;document.body.classList.toggle('darkbody',t==='dark'||(t==='auto'&&matchMedia('(prefers-color-scheme: dark)').matches))}
['design','design2','remoteName','remoteName2'].forEach(id=>document.getElementById(id).addEventListener('input',render));document.getElementById('theme').addEventListener('change',theme);document.getElementById('multi').addEventListener('change',e=>{document.getElementById('secondField').style.display=e.target.checked?'block':'none';document.getElementById('secondNameField').style.display=e.target.checked?'block':'none';render()});
render();theme();
</script></body></html>
