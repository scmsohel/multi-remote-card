<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Universal Remote Card Preview</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Arial,sans-serif;background:#10141b;color:#111;display:flex;justify-content:center;padding:24px}.wrap{width:min(430px,96vw)}.controls{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}.control{background:#fff;border-radius:14px;padding:11px 13px;box-shadow:0 5px 16px #0003}.control label{display:block;font-size:11px;font-weight:700;color:#777;margin-bottom:5px}.control select,.control button{width:100%;border:0;background:#eee;padding:9px;border-radius:9px;font-weight:700}.toggle{display:flex;align-items:center;justify-content:space-between}.switch{width:42px!important;height:24px;border-radius:20px!important;padding:0!important;background:#ccc!important}.switch.on{background:#292929!important}.preview{background:#f4f2ee;border-radius:28px;padding:20px 16px 24px;box-shadow:0 20px 60px #0008}.tabs{display:flex;background:#dddcd8;border-radius:28px;padding:4px;margin-bottom:28px}.tabs button{flex:1;border:0;border-radius:24px;padding:13px;background:transparent;font-weight:700}.tabs .active{background:#292929;color:#fff}.title{text-align:center;letter-spacing:5px;font-weight:700;color:#888;margin-bottom:16px}.circle{width:285px;height:285px;margin:auto;border:1px solid #fff;border-radius:50%;position:relative}.speed{position:absolute;width:54px;height:54px;border:0;border-radius:50%;background:#fff;box-shadow:0 6px 14px #0002;font-size:18px;font-weight:700;cursor:pointer;transition:.16s}.speed:active,.center:active,.btn:active{transform:translateY(5px);box-shadow:0 2px 5px #0002}.s3{left:calc(50% - 27px);top:10px}.s2{left:27px;top:68px}.s4{right:27px;top:68px}.s1{left:18px;bottom:58px}.s5{right:18px;bottom:58px}.s6{left:calc(50% - 27px);bottom:8px}.center{position:absolute;left:calc(50% - 48px);top:calc(50% - 48px);width:96px;height:96px;border:0;border-radius:50%;background:#fff;box-shadow:0 8px 18px #0002;cursor:pointer;font-size:38px;transition:.16s}.reverse{display:block;margin:18px auto 24px;padding:13px 34px;border:0;border-radius:22px;background:#fff;box-shadow:0 5px 12px #0002;font-weight:700;cursor:pointer}.row{display:flex;gap:10px}.btn{flex:1;border:0;border-radius:18px;padding:17px 8px;background:#fff;box-shadow:0 5px 12px #0002;font-weight:700;cursor:pointer;transition:.16s}.timer-title{text-align:center;letter-spacing:4px;color:#888;font-weight:700;margin:30px 0 14px}.walton-top,.walton-bottom{display:flex;gap:10px;margin-bottom:16px}.walton-top .btn,.walton-bottom .btn{padding:14px}.walton-circle{width:285px;height:285px;margin:auto;border:1px solid #fff;border-radius:50%;position:relative}.walton-circle .speed{background:#fff}.walton-center{position:absolute;left:calc(50% - 48px);top:calc(50% - 48px);width:96px;height:96px;border-radius:50%;background:#fff;box-shadow:0 8px 18px #0002;display:grid;place-items:center;font-size:42px}.wt{display:flex;gap:10px;margin:16px 0}.wt .btn{padding:14px}.hidden{display:none}.flash{animation:flash .35s}@keyframes flash{50%{transform:translateY(4px) scale(.96);filter:brightness(.88)}}body.dark{background:#090c12;color:#eee}body.dark .preview,body.dark .control{background:#171b22;color:#eee}body.dark .control label{color:#9da4ae}body.dark .control select,body.dark .control button:not(.switch){background:#252b34;color:#fff}.dark .tabs{background:#282d35}.dark .tabs .active{background:#f4f4f4;color:#111}.dark .speed,.dark .center,.dark .reverse,.dark .btn,.dark .walton-center{background:#242a33;color:#fff;box-shadow:0 6px 14px #0008}.dark .circle,.dark .walton-circle{border-color:#444}.dark .title,.dark .timer-title{color:#9da4ae}</style></head><body><div class="wrap"><div class="controls"><div class="control"><label>REMOTE DESIGN</label><select id="design"><option value="fan">Basic Celling Fan</option><option value="walton">Walton Ceiling Fan</option><option value="box">Fenda Sound Box</option></select></div><div class="control"><label>THEME</label><select id="theme"><option value="auto">Auto</option><option value="light">Light</option><option value="dark">Dark</option></select></div><div class="control"><label>REMOTE NAME</label><input id="name" value="Bedroom Fan" style="width:100%;padding:9px;border:0;border-radius:9px;background:#eee;font-weight:700"></div><div class="control toggle"><span><b>MULTIPLE REMOTE</b><small style="display:block;color:#777;margin-top:3px">Show Remote 2</small></span><button id="multi" class="switch">OFF</button></div></div><main class="preview"><div id="tabs" class="tabs"><button class="active">BEDROOM</button><button>LOUNGE</button></div><div id="app"></div></main></div><script>const app=document.getElementById('app'),design=document.getElementById('design'),theme=document.getElementById('theme'),multi=document.getElementById('multi'),tabs=document.getElementById('tabs');function speedButtons(){return '<button class="speed s3" data-a="3">3</button><button class="speed s2" data-a="2">2</button><button class="speed s4" data-a="4">4</button><button class="speed s1" data-a="1">1</button><button class="speed s5" data-a="5">5</button><button class="speed s6" data-a="6">6</button>'}function fan(){return '<div class="title">FAN</div><div class="circle">'+speedButtons()+'<button class="center" data-a="power">♣</button></div><button class="reverse" data-a="reverse">⇄ &nbsp; REVERSE</button><div class="row"><button class="btn" data-a="eco">ECO</button><button class="btn" data-a="light">💡</button><button class="btn" data-a="max">MAX</button></div><div class="timer-title">TIMER</div><div class="row"><button class="btn" data-a="1h">◷ &nbsp;1H</button><button class="btn" data-a="4h">◷ &nbsp;4H</button><button class="btn" data-a="8h">◷ &nbsp;8H</button></div>'}function walton(){return '<div class="title">WALTON CEILING FAN</div><div class="walton-top"><button class="btn" data-a="power">⏻ &nbsp; POWER</button><button class="btn" data-a="led">💡 &nbsp; LED</button></div><div class="walton-circle">'+speedButtons()+'<div class="walton-center">♣</div></div><div class="wt"><button class="btn" data-a="2h">2H</button><button class="btn" data-a="4h">4H</button><button class="btn" data-a="8h">8H</button></div><div class="walton-bottom"><button class="btn" data-a="eco">ECO</button><button class="btn" data-a="rev">⇄ &nbsp; REV</button></div>'}function box(){return '<div class="title">FENDA SOUND BOX</div><div style="text-align:center;padding:70px 10px"><div style="font-size:72px">🔊</div><h2>Sound Box Preview</h2><div class="row"><button class="btn" data-a="power">POWER</button><button class="btn" data-a="play">▶ PLAY</button></div></div>'}function render(){app.innerHTML=design.value==='fan'?fan():design.value==='walton'?walton():box();document.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{b.classList.remove('flash');void b.offsetWidth;b.classList.add('flash')})}design.onchange=render;theme.onchange=()=>{document.body.classList.toggle('dark',theme.value==='dark');if(theme.value==='auto')document.body.classList.remove('dark')};multi.onclick=()=>{multi.classList.toggle('on');multi.textContent=multi.classList.contains('on')?'ON':'OFF';tabs.classList.toggle('hidden',!multi.classList.contains('on'))};render();</script></body></html>
